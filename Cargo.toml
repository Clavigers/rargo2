[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libc = "0.2"
blake3 = { version = "1", features = ["rayon", "mmap"] }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
rayon = "1"
zstd = "0.13"
redb = "2"
git2 = { version = "0.20", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
tempfile = "3"
sha1 = "0.10"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
