[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/sadosystems/rargo2"
homepage = "https://rargo.rs"

[workspace.dependencies]
libc = "0.2"
blake3 = { version = "1", features = ["rayon", "mmap"] }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
rayon = "1"
zstd = "0.13"
redb = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process", "fs"] }
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
