[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.7.14"
edition = "2024"
license = "MIT"
repository = "https://github.com/Clavigers/rargo2"
homepage = "https://rargo.rs"

[workspace.dependencies]
libc = "0.2"
blake3 = { version = "1", features = ["rayon", "mmap"] }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
rayon = "1"
zstd = "0.13"
redb = "2"
io-uring = "0.7"
corosensei = "0.3"
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3

# Optimize the test binaries. The simulator checks
# every invariant after every event.
[profile.test]
opt-level = 3

[profile.release]
debug = "line-tables-only"
