name: service check
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release whose client is used (a tag; empty for the latest release)
        default: ""
permissions:
  contents: read
jobs:
  from-outside:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The released client
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download ${VERSION:+"$VERSION"} --pattern 'rargo-x86_64-unknown-linux-musl' --pattern SHA256SUMS
          sha256sum -c --ignore-missing --strict SHA256SUMS
          grep -q ' rargo-x86_64-unknown-linux-musl$' SHA256SUMS
          install -m 755 rargo-x86_64-unknown-linux-musl "$HOME/rargo"
      - name: Build, run and test through the server
        env:
          RARGO_SERVER: ${{ secrets.RARGO_CHECK_SERVER }}
          RARGO_TOKEN: ${{ secrets.RARGO_CHECK_TOKEN }}
        run: deploy/check-service.sh "$HOME/rargo"
