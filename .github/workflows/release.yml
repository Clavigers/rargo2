name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  statuses: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require the build-machine gate on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: dev/release-gate.sh "$(git rev-parse HEAD)"
      - name: Tag and manifest agree
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$v" ] || { echo "Cargo.toml is not at $v"; exit 1; }
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools libssl-dev zlib1g-dev pkg-config
      - name: Client (static) and server
        run: |
          CC_x86_64_unknown_linux_musl=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --locked --release -p rargo --target x86_64-unknown-linux-musl
          cargo build --locked --release -p rargod -p rargo-core
          strip target/x86_64-unknown-linux-musl/release/rargo
      - uses: actions/cache@v4
        id: planner
        with:
          path: planner/target/release/cargo
          key: planner-${{ hashFiles('forks/cargo/**') }}
      - name: Planner (the cargo fork)
        if: steps.planner.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/rust-lang/cargo.git planner
          git -C planner checkout -q -b rargo "$(cat forks/cargo/BASE)"
          git -C planner -c user.name=rargo -c user.email=noreply@rargo.invalid am "$PWD"/forks/cargo/*.patch
          sed -i "s|/root/rargo/crates/rargo-plan|$PWD/crates/rargo-plan|" planner/Cargo.toml
          grep -q "$PWD/crates/rargo-plan" planner/Cargo.toml
          (cd planner && CFG_RELEASE_CHANNEL=stable cargo build --release --bin cargo)
      - name: Assets
        run: deploy/make-assets.sh assets target/x86_64-unknown-linux-musl/release/rargo target/release/rargod target/release/rargo-sandbox planner/target/release/cargo
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "rargo ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --clobber assets/*
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
  crates:
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      HAVE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAVE_TOKEN != 'true'
      - name: Publish, dependencies first (versions already there are skipped)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for c in fusewire rargo-proto rargo-net rargo; do
            if curl -fsS -A "rargo-release-workflow" "https://crates.io/api/v1/crates/$c/$v" >/dev/null 2>&1; then
              echo "$c $v is already published"
            else
              cargo publish --locked -p "$c"
            fi
          done
