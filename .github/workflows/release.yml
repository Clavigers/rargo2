name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  checks: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require CI on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: dev/ci-passed.sh "$(git rev-parse HEAD)"
      - name: Tag and manifest agree
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$v" ] || { echo "Cargo.toml is not at $v"; exit 1; }
      - name: The service deploys published releases only
        env:
          GH_TOKEN: ${{ github.token }}
        run: dev/update-service-test.sh
      - name: install.sh installs a release only once the build server runs it
        run: dev/release-local-test.sh
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
      - name: The default flake's toolchain has the standard library's sources, with and without a toolchain file
        run: dev/default-flake-check.sh
      - name: Installer shell syntax
        run: sh -n install/install.sh && sh -n install/install-server.sh
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools libssl-dev zlib1g-dev pkg-config
      - name: Client (static) and server
        run: |
          CC_x86_64_unknown_linux_musl=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --locked --release -p rargo --target x86_64-unknown-linux-musl
          cargo build --locked --release -p rargod -p rargo-core
          strip target/x86_64-unknown-linux-musl/release/rargo
      - name: Verify the shipped client is static
        run: file target/x86_64-unknown-linux-musl/release/rargo | grep -q 'static'
      - name: io_uring runs on the runner, and a default Docker container refuses it with what to change
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          rc=0; HOME=$d RARGO_SERVER=127.0.0.1:1 RARGO_CACHE_DIR=$d/cache timeout 3 target/x86_64-unknown-linux-musl/release/rargo --rargo-daemon $d/probe.sock || rc=$?
          test $rc = 124
          rc=0; out=$(docker run --rm -e RARGO_SERVER=127.0.0.1:1 -e HOME=/tmp -v "$PWD/target/x86_64-unknown-linux-musl/release:/b:ro" ubuntu:24.04 /b/rargo --rargo-daemon /tmp/probe.sock 2>&1) || rc=$?
          echo "$out"
          test "$rc" = 101
          grep -q '^error: io_uring is unavailable (io_uring_setup returned EPERM)' <<<"$out"
          grep -q 'seccomp=unconfined' <<<"$out"
          out=$(docker run --rm -e HOME=/tmp -v "$PWD/target/x86_64-unknown-linux-musl/release:/b:ro" ubuntu:24.04 /b/rargo status 2>&1)
          echo "$out"
          grep -q '^io_uring  unavailable, so rargo cannot build here: io_uring is unavailable (io_uring_setup returned EPERM)' <<<"$out"
      - uses: actions/cache@v4
        id: planner
        with:
          path: planner/target/release/cargo
          # Everything the step below builds from: the fork's base and patches, the
          # rargo-plan it is pointed at, and this workflow (the build commands).
          key: planner-${{ hashFiles('forks/cargo/**', 'crates/rargo-plan/**', '.github/workflows/release.yml') }}
      - name: Planner (the cargo fork)
        if: steps.planner.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/rust-lang/cargo.git planner
          git -C planner checkout -q -b rargo "$(cat forks/cargo/BASE)"
          git -C planner -c user.name=rargo -c user.email=noreply@rargo.invalid am "$PWD"/forks/cargo/*.patch
          sed -i "s|/root/rargo/crates/rargo-plan|$PWD/crates/rargo-plan|" planner/Cargo.toml
          grep -q "$PWD/crates/rargo-plan" planner/Cargo.toml
          (cd planner && CFG_RELEASE_CHANNEL=stable cargo build --release --bin cargo)
      - name: Assets
        run: deploy/make-assets.sh assets target/x86_64-unknown-linux-musl/release/rargo target/release/rargod target/release/rargo-sandbox planner/target/release/cargo
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "rargo ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --clobber assets/*
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
  crates:
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      HAVE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAVE_TOKEN != 'true'
      - name: Publish, dependencies first (versions already there are skipped)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for c in rargo-machine fusewire rargo-proto rargo-net rargo; do
            if curl -fsS -A "rargo-release-workflow" "https://crates.io/api/v1/crates/$c/$v" >/dev/null 2>&1; then
              echo "$c $v is already published"
            else
              cargo publish --locked -p "$c"
            fi
          done
