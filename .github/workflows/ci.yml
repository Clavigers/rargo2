# What every push must pass: the workspace builds without warnings, the unit
# and engine tests pass (rargo builds rargo: every build here runs on the
# server Cargo.toml names, with the cache the developers' builds fill), the client builds as the static binary that is
# shipped, and the crates that go to crates.io package and build from their
# packaged form. The end-to-end suites need root, FUSE and the planner; they
# are run on the build machine before a release (dev/gate.sh).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTFLAGS: -D warnings
      # Plain files in target/: root runs the mount tests out of it, and a
      # runner's user cannot show root a file system of its own.
      RARGO_OUTPUT: copy
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: rargo, signed in to the server this repository names
        env:
          RARGO_TOKEN: ${{ secrets.RARGO_TOKEN }}
        run: |
          curl -fsSL https://rargo.rs/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rargo" auth --token "$RARGO_TOKEN"
      - name: Build (on the server, on the cache every other build of this commit uses)
        run: rargo build --locked --workspace
      - name: Unit tests (on the server)
        run: rargo test --locked --workspace --lib --bins
      - name: The tests that mount and make namespaces (built on the server, run here as root)
        run: dev/mount-tests.sh
      - name: The shipped client
        run: rargo build --locked --release -p rargo --target x86_64-unknown-linux-musl && file target/x86_64-unknown-linux-musl/release/rargo | grep -q 'static'
      - name: The crates that are published
        run: cargo package --locked -p fusewire -p rargo-proto -p rargo-net -p rargo
      - run: sh -n install/install.sh && sh -n install/install-server.sh
  new-user-path:
    # The path a new user takes (rargo @host, rargo auth, rargo build) and
    # the token commands, against a server of this commit started on the
    # runner (dev/e2e-auth.sh). The planner is the one of the latest
    # release: building the cargo fork takes longer than everything else.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: rargo, signed in to the server this repository names
        env:
          RARGO_TOKEN: ${{ secrets.RARGO_TOKEN }}
        run: |
          curl -fsSL https://rargo.rs/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rargo" auth --token "$RARGO_TOKEN"
      - run: RARGO_OUTPUT=copy rargo build --locked --release -p rargo -p rargod -p rargo-core
      - name: The planner of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern 'rargo-server-x86_64-unknown-linux-gnu.tar.gz' --pattern SHA256SUMS
          grep ' rargo-server-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS | sha256sum -c -
          tar -xzf rargo-server-x86_64-unknown-linux-gnu.tar.gz
      - name: rargo @host, rargo auth, rargo build, tokens
        run: |
          sudo -E env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            RARGO_WORK=/tmp/rargo-work RARGO_BIN=$PWD/target/release PLANNER=$PWD/rargo-server/planner-cargo \
            dev/e2e-auth.sh

