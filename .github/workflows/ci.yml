name: ci
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RARGO_SERVER: rargo.rs
      RUSTFLAGS: -D warnings
      RARGO_OUTPUT: copy
    steps:
      - uses: actions/checkout@v4
      # rargo can fetch the runtime closure for the test binaries through Nix.
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
      - name: rargo, signed in to rargo.rs
        env:
          RARGO_TOKEN: ${{ secrets.RARGO_TOKEN }}
        run: |
          curl -fsSL https://rargo.rs/install.sh | sh
          rargo auth --token "$RARGO_TOKEN"
      - run: rargo test --locked --workspace
