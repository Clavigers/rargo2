name: ci
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RARGO_SERVER: rargo.rs
      RUSTFLAGS: -D warnings
      RARGO_OUTPUT: copy
    steps:
      - uses: actions/checkout@v4
      # rargo can fetch the runtime closure for the test binaries through Nix.
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
      - name: rargo, signed in to rargo.rs
        env:
          RARGO_TOKEN: ${{ secrets.RARGO_TOKEN }}
        run: |
          sign_in() {
            local rc=0
            curl -fsSL --connect-timeout 10 --max-time 30 https://rargo.rs/install.sh > "$installer" || rc=$?
            case "$rc" in
              0) ;;
              6|7|28) return 75 ;;
              *) return 1 ;;
            esac
            if ! timeout 60s sh "$installer" > "$output" 2>&1; then
              cat "$output"
              if grep -Eq '^curl: [(](6|7|28)[)]' "$output"; then
                return 75
              fi
              return 1
            fi
            cat "$output"
            if timeout 30s rargo auth --token "$RARGO_TOKEN" > "$output" 2>&1; then
              cat "$output"
              return 0
            fi
            cat "$output"
            if grep -Eq '^error: (rargo auth: )?(cannot find the rargo server .+: (nothing answers there|no machine has that name)|cannot reach the rargo server at )' "$output"; then
              return 75
            fi
            return 1
          }

          installer=$(mktemp)
          output=$(mktemp)
          trap 'rm -f "$installer" "$output"' EXIT
          deadline=$((SECONDS + 600))
          while true; do
            rc=0
            sign_in || rc=$?
            case "$rc" in
              0) break ;;
              75) ;;
              *) exit "$rc" ;;
            esac
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "::error::The rargo server did not answer within the sign-in retry window."
              exit 1
            fi
            echo "::warning::The rargo server did not answer. Retrying sign-in."
            sleep "$((remaining < 60 ? remaining : 60))"
          done
      - run: rargo test --locked --workspace
      - name: One real sandbox run on a FUSE mount (temporary, for this pull request)
        run: |
          sudo modprobe fuse
          echo Y | sudo tee /sys/module/fuse/parameters/enable_uring
          rargo build --locked -p rargo-core --bin rargo-sandbox --target x86_64-unknown-linux-musl
          script='set -e; ls / ; cat /etc/passwd | wc -c; find /usr -maxdepth 2 | wc -l; cd /tmp 2>/dev/null || cd "$PWD"; pwd; echo hello > x; cat x; mkdir -p d/e; mv x d/e/y; ln -s y d/e/z; cat d/e/z; ls -la d/e; head -c 3000000 /dev/zero > big; wc -c big; cp big big2; cmp big big2; rm -r d big big2; t0=$(date +%s%N); for i in 1 2 3 4 5 6 7 8; do (find /usr/lib -type f 2>/dev/null | head -4000 | xargs cat 2>/dev/null | wc -c) & done; wait; t1=$(date +%s%N); echo TIMING parallel-read-ms $(( (t1-t0)/1000000 )); t0=$(date +%s%N); find /usr -type f 2>/dev/null | wc -l; t1=$(date +%s%N); echo TIMING walk-ms $(( (t1-t0)/1000000 )); t0=$(date +%s%N); for i in 1 2 3 4 5 6 7 8; do (find /usr/share -type f 2>/dev/null | xargs stat -c %s 2>/dev/null | wc -l) & done; wait; t1=$(date +%s%N); echo TIMING parallel-stat-ms $(( (t1-t0)/1000000 )); echo done'
          bin=$(find "$PWD/target/x86_64-unknown-linux-musl" -name rargo-sandbox -type f -perm -u+x | head -1)
          echo "sandbox tool: $bin"; test -n "$bin"
          for mode in "" "--no-passthrough" "" "--no-passthrough"; do
            d=$(sudo mktemp -d)
            sudo timeout 180 "$bin" --state "$d" $mode -- /bin/sh -c "$script"
          done
      - name: Measure per-test CPU
        run: |
          export RARGO_CPU_REPORT="$RUNNER_TEMP/rargo-cpu.tsv"
          status=0
          python3 dev/purity.py cpu || status=$?
          if [[ -s "$RARGO_CPU_REPORT" ]]; then
            awk '$1 > 50 { print }' "$RARGO_CPU_REPORT"
          fi
          exit "$status"
