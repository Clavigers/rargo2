name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RARGO_SERVER: rargo.rs
      RUSTFLAGS: -D warnings
      RARGO_OUTPUT: copy
    steps:
      - uses: actions/checkout@v4
      - name: The service deploys published releases only
        env:
          GH_TOKEN: ${{ github.token }}
        run: dev/update-service-test.sh
      - name: The deploy brings the planner checkout up to a release's fork patches and builds it without changing it
        run: dev/planner-test.sh
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
      - name: Realise the flake closure for binaries from the build server
        run: nix develop --command true
      - name: The default flake's toolchain has the standard library's sources, with and without a toolchain file
        run: dev/default-flake-check.sh
      - name: rargo, signed in to rargo.rs
        env:
          RARGO_TOKEN: ${{ secrets.RARGO_TOKEN }}
        run: |
          curl -fsSL https://rargo.rs/install.sh | sh
          rargo auth --token "$RARGO_TOKEN"
      - name: Build (on the server, on the cache every other build of this commit uses)
        run: rargo build --locked --workspace
      - name: Every test of the workspace (built on the server, run here, as root, one process each), each within its CPU budget
        run: python3 -I dev/purity.py cpu
      - name: The purity allowlists and the time budgets only shrink
        run: git fetch -q --depth=1 origin main && python3 -I dev/purity.py ratchet FETCH_HEAD
      - name: The shipped client
        run: rargo build --locked --release -p rargo --target x86_64-unknown-linux-musl && file target/x86_64-unknown-linux-musl/release/rargo | grep -q 'static'
      - name: io_uring runs on the runner, and a default Docker container refuses it with what to change
        run: |
          d=$(mktemp -d)
          rc=0; HOME=$d RARGO_SERVER=127.0.0.1:1 RARGO_CACHE_DIR=$d/cache timeout 3 target/x86_64-unknown-linux-musl/release/rargo --rargo-daemon $d/probe.sock || rc=$?
          test $rc = 124
          rc=0; out=$(docker run --rm -e RARGO_SERVER=127.0.0.1:1 -e HOME=/tmp -v $PWD/target/x86_64-unknown-linux-musl/release:/b:ro ubuntu:24.04 /b/rargo --rargo-daemon /tmp/probe.sock 2>&1) || rc=$?
          echo "$out"
          test $rc = 101 && grep -q '^error: io_uring is unavailable (io_uring_setup returned EPERM)' <<<"$out" && grep -q 'seccomp=unconfined' <<<"$out"
          out=$(docker run --rm -e HOME=/tmp -v $PWD/target/x86_64-unknown-linux-musl/release:/b:ro ubuntu:24.04 /b/rargo status 2>&1)
          echo "$out"
          grep -q '^io_uring  unavailable, so rargo cannot build here: io_uring is unavailable (io_uring_setup returned EPERM)' <<<"$out"
      - name: The crates that are published
        run: nix develop --command cargo package --locked -p fusewire -p rargo-proto -p rargo-net -p rargo
      - run: sh -n install/install.sh && sh -n install/install-server.sh
