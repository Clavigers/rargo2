[package]
name = "rargo-plan"
publish = false
description = "The build plan format shared by rargo's cargo fork and rargod"
version = "0.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/sadosystems/rargo2"
homepage = "https://rargo.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Built inside the cargo fork too; it keeps its own (default) lints there.
[lints]
