[package]
name = "rargo"
description = "The rargo client: syncs a worktree and its environment to a rargo build server and brings back the results"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cargo", "build", "remote", "cache"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[dependencies]
rargo-proto = { path = "../rargo-proto", version = "0.3.4" }
rargo-net = { path = "../rargo-net", version = "0.3.4" }
fusewire = { path = "../fusewire", version = "0.3.4" }
tokio.workspace = true
libc.workspace = true
blake3.workspace = true
rayon.workspace = true
serde.workspace = true
bincode.workspace = true
zstd.workspace = true
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
